<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kurlo</title>
    <script>
      (() => {
        const systemTheme = () => {
          try {
            return typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch {
            return 'light';
          }
        };

        const platform = navigator.platform || navigator.userAgent || '';
        const defaultTheme = { mode: 'system', light: 'light', dark: 'dark' };
        const bootVariants = {
          "light": { "mode": "light", "bg": "#ffffff", "text": "#17171a", "muted": "#50505a", "accent": "#4f5be8" },
          "github-light": { "mode": "light", "bg": "#ffffff", "text": "#1f2328", "muted": "#424a53", "accent": "#0969da" },
          "jetbrains-light": { "mode": "light", "bg": "#ffffff", "text": "#000000", "muted": "#494b57", "accent": "#336fe6" },
          "vscode-light": { "mode": "light", "bg": "#ffffff", "text": "#1f1f1f", "muted": "#4d4d4d", "accent": "#005fb8" },
          "catppuccin-latte": { "mode": "light", "bg": "#eff1f5", "text": "#4c4f69", "muted": "#51546a", "accent": "#8839ef" },
          "flexoki-paper": { "mode": "light", "bg": "#fffcf0", "text": "#100f0f", "muted": "#403e3c", "accent": "#205ea6" },
          "high-contrast-light": { "mode": "light", "bg": "#ffffff", "text": "#000000", "muted": "#1f1f24", "accent": "#1d3fc4" },
          "dark": { "mode": "dark", "bg": "#111113", "text": "#ececef", "muted": "#a6a6ae", "accent": "#5865f2" },
          "github-dimmed": { "mode": "dark", "bg": "#22272e", "text": "#cdd9e5", "muted": "#adbac7", "accent": "#316dca" },
          "jetbrains-dark": { "mode": "dark", "bg": "#1e1f22", "text": "#dfe1e5", "muted": "#b4b8bf", "accent": "#336fe6" },
          "vscode-dark": { "mode": "dark", "bg": "#1f1f1f", "text": "#cccccc", "muted": "#ababab", "accent": "#0077d2" },
          "one-dark": { "mode": "dark", "bg": "#282c34", "text": "#d7dae0", "muted": "#abb2bf", "accent": "#4b74c6" },
          "tokyo-night": { "mode": "dark", "bg": "#1a1b26", "text": "#c0caf5", "muted": "#a9b1d6", "accent": "#7aa2f7" },
          "catppuccin-mocha": { "mode": "dark", "bg": "#1e1e2e", "text": "#cdd6f4", "muted": "#bac2de", "accent": "#cba6f7" },
          "nord": { "mode": "dark", "bg": "#2e3440", "text": "#eceff4", "muted": "#d8dee9", "accent": "#88c0d0" },
          "everforest": { "mode": "dark", "bg": "#2d353b", "text": "#d3c6aa", "muted": "#ccc7b7", "accent": "#a7c080" },
          "high-contrast-dark": { "mode": "dark", "bg": "#0b0b0c", "text": "#ffffff", "muted": "#e4e4e8", "accent": "#8c9bff" }
        };
        const retiredVariants = {
          "light-monochrome": "light",
          "light-pastel": "flexoki-paper",
          "dark-monochrome": "dark",
          "dark-pastel": "everforest",
          "catppuccin-frappe": "catppuccin-mocha",
          "catppuccin-macchiato": "catppuccin-mocha"
        };
        const currentVariant = value => typeof value === 'string' && Object.hasOwn(retiredVariants, value) ? retiredVariants[value] : value;
        const isLightVariant = value => bootVariants[currentVariant(value)]?.mode === 'light';
        const isDarkVariant = value => bootVariants[currentVariant(value)]?.mode === 'dark';
        const normalize = value => value === 'dark' || value === 'light' || value === 'system' ? value : 'system';
        const normalizeTheme = value => {
          if (typeof value === 'string') return { ...defaultTheme, mode: normalize(value) };
          if (!value || typeof value !== 'object') return { ...defaultTheme };
          return {
            mode: normalize(value.mode),
            light: isLightVariant(value.light) ? currentVariant(value.light) : defaultTheme.light,
            dark: isDarkVariant(value.dark) ? currentVariant(value.dark) : defaultTheme.dark,
          };
        };
        const themeFromStorage = () => {
          const stored = localStorage.getItem('kurlo.theme.v2');
          if (stored) {
            try {
              const parsed = JSON.parse(stored);
              return normalizeTheme(parsed);
            } catch {
              return normalizeTheme(stored);
            }
          }
          return normalizeTheme(localStorage.getItem('kurlo.theme.v1'));
        };

        document.documentElement.dataset.platform = /Mac/i.test(platform)
          ? 'darwin'
          : /Win/i.test(platform)
            ? 'windows'
            : /Linux/i.test(platform)
              ? 'linux'
              : 'browser';

        try {
          const scale = Number.parseFloat(localStorage.getItem('kurlo.uiScale.v1') || '');
          if (Number.isFinite(scale) && scale >= 0.5 && scale <= 2 && scale !== 1) document.documentElement.style.fontSize = `${scale * 100}%`;
        } catch {}

        try {
          const theme = themeFromStorage();
          const resolved = theme.mode === 'system' ? systemTheme() : theme.mode;
          const variantId = resolved === 'light' ? theme.light : theme.dark;
          const variant = bootVariants[variantId] || bootVariants[resolved];
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themeVariant = variantId;
          document.documentElement.style.colorScheme = resolved;
          document.documentElement.style.setProperty('--boot-bg', variant.bg);
          document.documentElement.style.setProperty('--boot-text', variant.text);
          document.documentElement.style.setProperty('--boot-muted', variant.muted);
          document.documentElement.style.setProperty('--boot-accent', variant.accent);
        } catch {
          const resolved = systemTheme();
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themeVariant = resolved;
          document.documentElement.style.colorScheme = resolved;
        }
      })();
    </script>
    <style>
      :root,
      :root[data-theme="light"] {
        --boot-bg: #ffffff;
        --boot-text: #17171a;
        --boot-muted: #50505a;
        --boot-accent: #4f5be8;
      }

      :root[data-theme="dark"] {
        --boot-bg: #111113;
        --boot-text: #ececef;
        --boot-muted: #a6a6ae;
        --boot-accent: #5865f2;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --boot-bg: #111113;
          --boot-text: #ececef;
          --boot-muted: #a6a6ae;
          --boot-accent: #5865f2;
        }
      }

      html, body, #app {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--boot-bg);
        color: var(--boot-text);
      }

      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: var(--boot-bg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity 0.32s ease;
      }

      .boot-screen.boot-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .boot-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .boot-mark {
        display: block;
        width: 44px;
        height: 44px;
        border-radius: 10px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16), 0 6px 18px rgba(0, 0, 0, 0.18);
        -webkit-user-drag: none;
      }

      .boot-name {
        color: var(--boot-text);
        font-size: 18px;
        font-weight: 600;
        line-height: 1;
      }

      .boot-status {
        margin-top: 5px;
        color: var(--boot-muted);
        font-size: 12px;
        line-height: 1;
      }

      .boot-loader {
        position: relative;
        width: 94px;
        height: 3px;
        margin-top: 14px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in srgb, var(--boot-muted) 24%, transparent);
      }

      .boot-loader::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 38%;
        border-radius: inherit;
        background: var(--boot-accent);
        animation: boot-load 1.1s ease-in-out infinite;
      }

      @keyframes boot-load {
        0% { transform: translateX(-105%); }
        55% { transform: translateX(118%); }
        100% { transform: translateX(250%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-loader::after { animation: none; transform: translateX(78%); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-screen" class="boot-screen" aria-label="Kurlo is starting">
        <div class="boot-brand">
          <img class="boot-mark" src="./src/lib/assets/kurlo-mark.png" alt="" width="44" height="44" draggable="false" />
          <div>
            <div class="boot-name">Kurlo</div>
            <div class="boot-status">Starting</div>
            <div class="boot-loader" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
