name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Check frontend
        run: npm run frontend:check

      - name: Test frontend
        run: npm --workspace @kurlo/desktop-frontend run test

      - name: Build frontend
        run: npm run frontend:build

      - name: Build web docs
        env:
          KURLO_SITE_URL: ${{ vars.KURLO_SITE_URL }}
          KURLO_SITE_BASE: ${{ vars.KURLO_SITE_BASE }}
        run: npm run web:build

      - name: Check web docs
        env:
          KURLO_SITE_BASE: ${{ vars.KURLO_SITE_BASE }}
        run: npm run web:check-docs

      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l apps/desktop/)
          if [ -n "$unformatted" ]; then
            echo "::error::These files need 'gofmt -w':"
            echo "$unformatted"
            exit 1
          fi
          echo "All Go files are formatted."

      - name: Check generated Wails bindings are current
        working-directory: apps/desktop
        run: |
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.16.0 generate module
          if ! git -c core.fileMode=false diff --quiet -- frontend/wailsjs; then
            echo "::error::wailsjs bindings are out of date. Run 'make bindings' and commit the result:"
            git -c core.fileMode=false diff --stat -- frontend/wailsjs
            git -c core.fileMode=false diff -- frontend/wailsjs
            exit 1
          fi
          echo "Generated bindings match the Go source."

      - name: Vet Go
        run: go vet ./apps/desktop/...

      - name: Test Go (race detector)
        run: go test -race ./apps/desktop/...

      - name: Build the npm CLI without cgo
        run: node scripts/build-npm-packages.mjs --version 0.0.0-ci --out "$RUNNER_TEMP/npm"

      - name: Dead code check
        run: |
          output=$(go run golang.org/x/tools/cmd/deadcode@v0.45.0 -test ./apps/desktop/...)
          if [ -n "$output" ]; then
            echo "::error::Unreachable (dead) code detected — remove it or wire it up:"
            echo "$output"
            exit 1
          fi
          echo "No dead code."

  go-cross-platform:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            race: true
          - os: windows-latest
            race: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum

      - name: Stand in for the embedded frontend
        shell: bash
        run: |
          mkdir -p apps/desktop/frontend/dist
          echo '<!doctype html><title>ci placeholder</title>' > apps/desktop/frontend/dist/index.html

      - name: Vet Go
        run: go vet ./apps/desktop/...

      - name: Test Go
        if: ${{ !matrix.race }}
        run: go test ./apps/desktop/...

      - name: Test Go (race detector)
        if: ${{ matrix.race }}
        run: go test -race ./apps/desktop/...

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: apps/desktop/frontend

      - name: Run E2E tests
        run: npm run frontend:e2e
        env:
          KURLO_E2E_ARTIFACT_DIR: ${{ runner.temp }}/playwright

      - name: Run E2E tests in WebKit
        run: npm run frontend:e2e:webkit
        env:
          KURLO_E2E_ARTIFACT_DIR: ${{ runner.temp }}/playwright-webkit

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ${{ runner.temp }}/playwright/html-report
          retention-days: 3
          if-no-files-found: ignore
