name: web-deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kurlo.dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          KURLO_SITE_URL: ${{ vars.KURLO_SITE_URL }}
          KURLO_SITE_BASE: ${{ vars.KURLO_SITE_BASE }}
        run: npm run web:build

      - name: Check docs
        run: npm run web:check-docs

      - name: Publish
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SITE_ROOT: /srv/kurlo.dev
          KEEP_RELEASES: '5'
        run: |
          set -euo pipefail

          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts

          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          RELEASE="$(date -u +%Y%m%d%H%M%S)"
          TARGET="$SITE_ROOT/releases/$RELEASE"

          $SSH "$DEPLOY_HOST" "mkdir -p '$TARGET'"

          rsync -az --delete \
            --rsh="$SSH" \
            --link-dest="$SITE_ROOT/current" \
            apps/web/dist/ "$DEPLOY_HOST:$TARGET/"

          $SSH "$DEPLOY_HOST" bash -s <<REMOTE
          set -euo pipefail
          ln -sfn '$TARGET' '$SITE_ROOT/current.tmp'
          mv -Tf '$SITE_ROOT/current.tmp' '$SITE_ROOT/current'
          cd '$SITE_ROOT/releases'
          ls -1dt */ | tail -n +$((KEEP_RELEASES + 1)) | xargs -r rm -rf
          REMOTE

          echo "published $RELEASE"

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
