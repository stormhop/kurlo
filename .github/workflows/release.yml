name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

env:
  WAILS_VERSION: v2.13.0
  GO_MODULE: github.com/stormhop/kurlo/apps/desktop/internal/api
  UPDATE_REPOSITORY: stormhop/kurlo
  UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: macos
          - os: windows-latest
            platform: windows/amd64
            artifact: windows
            arch: amd64
          - os: windows-11-arm
            platform: windows/arm64
            artifact: windows-arm64
            arch: arm64
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm install

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config libfuse2

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      - name: Set version
        shell: bash
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/wails.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.info = j.info || {};
            j.info.productVersion = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "

      - name: Require update signing public key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${UPDATE_PUBLIC_KEY:-}" ]; then
            echo "::error::Repository variable UPDATE_PUBLIC_KEY is required for release builds."
            exit 1
          fi

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          wails build -platform ${{ matrix.platform }} -tags webkit2_41 -ldflags "\
            -X ${{ env.GO_MODULE }}.appVersion=${{ env.VERSION }} \
            -X ${{ env.GO_MODULE }}.githubRepo=${{ env.UPDATE_REPOSITORY }} \
            -X ${{ env.GO_MODULE }}.updatePublicKey=${{ env.UPDATE_PUBLIC_KEY }}"
        working-directory: apps/desktop

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UPDATE_REPOSITORY: ${{ env.UPDATE_REPOSITORY }}
          UPDATE_PUBLIC_KEY: ${{ env.UPDATE_PUBLIC_KEY }}
        run: |
          wails build -platform ${{ matrix.platform }} -nsis -ldflags `
            "-X ${{ env.GO_MODULE }}.appVersion=${{ env.VERSION }} `
             -X ${{ env.GO_MODULE }}.githubRepo=$env:UPDATE_REPOSITORY `
             -X ${{ env.GO_MODULE }}.updatePublicKey=$env:UPDATE_PUBLIC_KEY"
        working-directory: apps/desktop

      - name: Build Windows MSIX
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = ""
          if (-not [string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_BASE64)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "kurlo-msix.pfx"
            [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64))
          }

          ./build/windows/package-msix.ps1 `
            -Version "$env:VERSION" `
            -Architecture "${{ matrix.arch }}" `
            -OutputPath "build/bin/kurlo-$env:VERSION-windows-${{ matrix.arch }}.msix" `
            -CertificatePath "$certificatePath" `
            -CertificatePassword "$env:MSIX_CERTIFICATE_PASSWORD"
        working-directory: apps/desktop

      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: |
          wails build -platform ${{ matrix.platform }} -tags webkit2_41 -ldflags "\
            -X ${{ env.GO_MODULE }}.appVersion=${{ env.VERSION }} \
            -X ${{ env.GO_MODULE }}.githubRepo=${{ env.UPDATE_REPOSITORY }} \
            -X ${{ env.GO_MODULE }}.updatePublicKey=${{ env.UPDATE_PUBLIC_KEY }}"
        working-directory: apps/desktop

      - name: Package macOS raw binary
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          cp apps/desktop/build/bin/Kurlo.app/Contents/MacOS/kurlo release/kurlo-darwin-universal
          (cd apps/desktop/build/bin && ditto -c -k --keepParent Kurlo.app "$GITHUB_WORKSPACE/release/kurlo-darwin-universal.app.zip")

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          mkdir -p release
          apps/desktop/build/darwin/make-dmg.sh \
            apps/desktop/build/bin/Kurlo.app \
            "release/kurlo-${VERSION}-darwin-universal.dmg" \
            "Kurlo ${VERSION}"

      - name: Package Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Build output:"; Get-ChildItem apps\desktop\build\bin\ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force release | Out-Null
          $installer = Get-ChildItem apps\desktop\build\bin\*installer.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found in build\bin — check that NSIS is installed and wails build -nsis succeeded" }
          Copy-Item $installer.FullName "release\kurlo-$env:VERSION-windows-${{ matrix.arch }}-installer.exe"
          $msix = Get-ChildItem apps\desktop\build\bin\*.msix -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msix) { throw "MSIX package not found in build\bin — check that package-msix.ps1 succeeded" }
          Copy-Item $msix.FullName "release\kurlo-$env:VERSION-windows-${{ matrix.arch }}.msix"

          $raw = Get-ChildItem apps\desktop\build\bin\*.exe -Exclude *installer* -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $raw) { throw "Raw Windows binary not found in build\bin — auto-update artifact is required" }
          Copy-Item $raw.FullName "release\kurlo-windows-${{ matrix.arch }}.exe"

      - name: Package Linux raw binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          cp apps/desktop/build/bin/kurlo release/kurlo-linux-amd64
          chmod +x release/kurlo-linux-amd64

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/512x512/apps \
                   release

          cp apps/desktop/build/bin/kurlo          AppDir/usr/bin/kurlo
          cp apps/desktop/build/appicon.png        AppDir/usr/share/icons/hicolor/512x512/apps/kurlo.png
          cp apps/desktop/build/appicon.png        AppDir/kurlo.png

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Kurlo' \
            'Exec=kurlo' \
            'Icon=kurlo' \
            'Categories=Development;' \
            'Comment=Cross-platform desktop API client' \
            > AppDir/kurlo.desktop
          cp AppDir/kurlo.desktop AppDir/usr/share/applications/kurlo.desktop

          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'exec "$HERE/usr/bin/kurlo" "$@"' \
            > AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/kurlo

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            AppDir "release/kurlo-${VERSION}-linux-amd64.AppImage"

      - name: Smoke test the macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          output="$(release/kurlo-darwin-universal --version)"
          echo "$output"
          case "$output" in
            *"$VERSION"*) ;;
            *) echo "::error::built binary reports '$output', expected version $VERSION"; exit 1 ;;
          esac
          release/kurlo-darwin-universal --diagnostics
          bundle_dir="$(mktemp -d)"
          ditto -x -k release/kurlo-darwin-universal.app.zip "$bundle_dir"
          bundle_version="$(plutil -extract CFBundleShortVersionString raw -o - "$bundle_dir/Kurlo.app/Contents/Info.plist")"
          if [ "$bundle_version" != "$VERSION" ]; then
            echo "::error::the app bundle reports version '$bundle_version', expected $VERSION"
            exit 1
          fi
          test -f "$bundle_dir/Kurlo.app/Contents/Resources/iconfile.icns"
          test -x "$bundle_dir/Kurlo.app/Contents/MacOS/kurlo"

      - name: Smoke test the Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "kurlo-version.txt"
          $process = Start-Process -FilePath "release\kurlo-windows-${{ matrix.arch }}.exe" `
            -ArgumentList "--version" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          if ($process.ExitCode -ne 0) {
            throw "built binary exited with $($process.ExitCode)"
          }
          $output = (Get-Content $out -Raw).Trim()
          Write-Host $output
          if ($output -notlike "*$env:VERSION*") {
            throw "built binary reports '$output', expected version $env:VERSION"
          }

      - name: Smoke test the Linux binary and AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          output="$(release/kurlo-linux-amd64 --version)"
          echo "$output"
          case "$output" in
            *"$VERSION"*) ;;
            *) echo "::error::built binary reports '$output', expected version $VERSION"; exit 1 ;;
          esac
          release/kurlo-linux-amd64 --diagnostics
          appimage="release/kurlo-${VERSION}-linux-amd64.AppImage"
          chmod +x "$appimage"
          packaged="$("$appimage" --appimage-extract-and-run --version)"
          echo "$packaged"
          case "$packaged" in
            *"$VERSION"*) ;;
            *) echo "::error::AppImage reports '$packaged', expected version $VERSION"; exit 1 ;;
          esac

      - name: Smoke test the Linux binary on newer Ubuntu releases
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for image in ubuntu:24.04 ubuntu:26.04; do
            output="$(docker run --rm -v "$PWD/release:/release:ro" "$image" bash -c \
              'apt-get update -qq >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libgtk-3-0 libwebkit2gtk-4.1-0 >/dev/null && /release/kurlo-linux-amd64 --version')"
            echo "$image: $output"
            case "$output" in
              *"$VERSION"*) ;;
              *) echo "::error::$image: binary reports '$output', expected version $VERSION"; exit 1 ;;
            esac
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kurlo-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          : > release-notes.md
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          TYPE=$(git for-each-ref --format='%(objecttype)' "refs/tags/${{ github.ref_name }}")
          if [ "$TYPE" = "tag" ]; then
            git for-each-ref --format='%(contents)' "refs/tags/${{ github.ref_name }}" \
              | sed '/^-----BEGIN PGP SIGNATURE-----$/,/^-----END PGP SIGNATURE-----$/d' \
              | awk 'NF { last=NR } { line[NR]=$0 } END { for (i=1; i<=last; i++) print line[i] }' \
              > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            printf '%s\n' 'Bug fixes and improvements' > release-notes.md
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Sign update artifacts
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${UPDATE_PUBLIC_KEY:-}" ]; then
            echo "::error::Repository variable UPDATE_PUBLIC_KEY is required for signed updates."
            exit 1
          fi
          if [ -z "${UPDATE_SIGNING_KEY:-}" ]; then
            echo "::error::UPDATE_SIGNING_KEY secret is required for signed updates."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y minisign
          key_file="$(mktemp)"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key_file"
          trap 'rm -f "$key_file"' EXIT
          for asset in release/kurlo-darwin-universal release/kurlo-darwin-universal.app.zip release/kurlo-windows-amd64.exe release/kurlo-windows-arm64.exe release/kurlo-linux-amd64 "release/kurlo-${GITHUB_REF_NAME#v}-linux-amd64.AppImage"; do
            if [ ! -f "$asset" ]; then
              echo "::error::missing asset for signing: $asset"
              exit 1
            fi

            minisign -S -W -s "$key_file" -t "kurlo $GITHUB_REF_NAME $(basename "$asset")" -m "$asset"
            test -f "${asset}.minisig"
          done

      - name: Generate update manifest
        env:
          UPDATE_REPOSITORY: ${{ env.UPDATE_REPOSITORY }}
          UPDATE_PUBLIC_KEY: ${{ env.UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          args=(
            --release-dir release
            --tag "$GITHUB_REF_NAME"
            --repo "$UPDATE_REPOSITORY"
            --notes-file release-notes.md
            --platforms darwin-universal,darwin-universal-app,windows-amd64,windows-arm64,linux-amd64,linux-amd64-appimage
            --require-signature
          )
          python3 scripts/make-latest-json.py "${args[@]}"

      - name: Package the browser extension
        run: python3 scripts/package-browser-extension.py --version "${GITHUB_REF_NAME#v}" --out release

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_REPOSITORY: ${{ env.UPDATE_REPOSITORY }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${UPDATE_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --repo "${UPDATE_REPOSITORY}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --repo "${UPDATE_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" release/* --repo "${UPDATE_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          fi

  homebrew:
    name: Update Homebrew cask
    needs: publish
    runs-on: ubuntu-22.04
    if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' }}

    steps:
      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask
        env:
          UPDATE_REPOSITORY: ${{ env.UPDATE_REPOSITORY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${UPDATE_REPOSITORY}/releases/download/v${VERSION}/kurlo-${VERSION}-darwin-universal.dmg"
          SHA="$(curl -fsSL "$URL" | shasum -a 256 | awk '{print $1}')"
          mkdir -p tap/Casks
          cat > tap/Casks/kurlo.rb << RUBY
          cask "kurlo" do
            version "$VERSION"
            sha256 "$SHA"

            url "$URL"
            name "Kurlo"
            desc "Cross-platform desktop API client"
            homepage "https://github.com/stormhop/kurlo"

            app "Kurlo.app"
          end
          RUBY

      - name: Commit and push tap
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/kurlo.rb
          git commit -m "Update Kurlo to ${GITHUB_REF_NAME}" || exit 0
          git push

  npm:
    name: Stage npm packages
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/desktop/go.mod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Build packages
        run: node scripts/build-npm-packages.mjs --version "${GITHUB_REF_NAME#v}"

      - name: Stage packages
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          stage() {
            local dir="$1" out attempt
            for attempt in 1 2 3; do
              if out="$(npm stage publish "./$dir" --access public --tag "$tag" 2>&1)"; then
                echo "$out"
                return 0
              fi
              echo "$out"
              if grep -q "Cannot stage previously published version" <<<"$out"; then
                echo "already staged; skipping"
                return 0
              fi
              grep -qE "E5[0-9]{2}" <<<"$out" || return 1
              sleep $((attempt * 20))
            done
            return 1
          }
          for dir in release/npm/@kurlo/*-* release/npm/@kurlo/cli; do
            name="$(node -p "require('./$dir/package.json').name")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            stage "$dir"
          done

  mcp-registry:
    name: Publish to the MCP Registry
    needs: npm
    uses: ./.github/workflows/mcp-registry.yml
    with:
      version: ${{ github.ref_name }}
      wait-minutes: 180
    secrets:
      MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
